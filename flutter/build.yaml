targets:
  $default:
    builders:
      slang_build_runner:
        options:
          base_locale: en
          input_directory: assets/translations
          input_file_pattern: .yaml
          maps:
            - navigation.section_titles
            - routes.settings.create_rename_codes
            - routes.settings.profiles_failed_codes
            - routes.startup.login.failed_codes
            - routes.startup.setup.failed_codes
            - setting_descriptions
            - setting_group_names
            - setting_names
