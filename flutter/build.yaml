targets:
  $default:
    builders:
      slang_build_runner:
        options:
          base_locale: en
          input_directory: assets/translations
          input_file_pattern: .yaml
          timestamp: false
          maps:
            - navigation.section_titles
            - routes.settings.create_rename_codes
            - routes.startup.login.failed_codes
            - routes.startup.setup.failed_codes
            - setting_choices.client
            - setting_choices.server
            - setting_definitions.client
            - setting_definitions.server
            - setting_groups.client
            - setting_groups.server
